# SWIM_SA configuration for the planner experiments (run_sa.sh mounts a copy of
# this file, with per-run settings added under [General], as
# simulations/swim_sa/run.ini in selas-swim-pla:dev).
#
# It is clayness/swim's swim_sa.ini (the one that reproduces SWIM's shipped PLA
# and Thallium runs) with three changes, none of which touches the simulation:
#   1. both traces and all five boot delays, iterated exactly as in SWIM's own
#      swim_sa.ini, so run indices mean what they mean everywhere else in this
#      project: 3 = WorldCup at 180 s, 8 = ClarkNet at 180 s;
#   2. per-server vectors (service time, queue length) are not recorded; the
#      scorer needs only the monitor, arrival and sink vectors, and a full grid
#      would otherwise need tens of GB;
#   3. configurations for every manager used here.
[General]
num-rngs = 3

# save results in sqlite format
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
outputscalarmanager-class = "omnetpp::envir::SqliteOutputScalarManager"
outputvectormanager-class = "omnetpp::envir::SqliteOutputVectorManager"
**.server*.**.vector-recording = false

# non-default statistics rercording
*.initialServers.param-record-as-scalar = true
*.maxServers.param-record-as-scalar = true
*.bootDelay.param-record-as-scalar = true
*.numberOfBrownoutLevels.param-record-as-scalar = true
*.evaluationPeriod.param-record-as-scalar = true
*.responseTimeThreshold.param-record-as-scalar = true
*.maxServiceRate.param-record-as-scalar = true

network = SWIM_SA
result-dir = ../../../results/SWIM_SA

# simulation input and duration
*.source.interArrivalsFile = ${trace = "traces/wc_day53-r0-105m-l70.delta", "traces/clarknet-http-105m-l70.delta"}
sim-time-limit = 6300s
warmup-period = 900s

# adaptation loop period
*.evaluationPeriod = 60

# adaptation manager params
*.numberOfBrownoutLevels = 10
*.dimmerMargin = 0.1
*.responseTimeThreshold = 0.75s

# server pool configuration
*.maxServers = 12
*.initialServers = 3

# server config
**.server*.server.threads = 100
**.server*.server.brownoutFactor = 0.1
**.server*.server.timeout = 10s

# for plotting, use latency as iteration variable even if no iteration is needed
*.bootDelay = ${latency = 0, 60, 120, 180, 240} # deterministic boot times

# service time configuration
**.server*.server.serviceTime = truncnormal(0.030s,0.030s)
**.server*.server.lowFidelityServiceTime = truncnormal(0.001s,0.001s)

# this is used for the SEAMS'17 CobRA-PLA utility function
*.maxServiceRate = 1 / 0.04452713 # typically the inverse of the normal service time

[Config Reactive]
*.adaptationManagerType = "ReactiveAdaptationManager"

[Config Reactive2]
*.adaptationManagerType = "ReactiveAdaptationManager2"

# Stevens's PLA-SDP port with its own planning utility (as shipped)
[Config pladapt]
*.adaptationManagerType = "ProactiveAdaptationManager"

# the same planner, planning for SEAMS 2017A (patch swim-02)
[Config pladapt_seams2017a]
*.adaptationManagerType = "ProactiveAdaptationManager"
**.adaptationManager.planningUtility = "seams2017a"

# sensitivity variant: full-content service time 1/maxServiceRate (0.0445 s) instead of 0.030 s
[Config pladapt_seams2017a_maxrate]
*.adaptationManagerType = "ProactiveAdaptationManager"
**.adaptationManager.planningUtility = "seams2017a-maxrate"

# sensitivity variant: SEAMS 2017A with Stevens's M/M/c inputs (see patch swim-02)
[Config pladapt_seams2017a_stevensrt]
*.adaptationManagerType = "ProactiveAdaptationManager"
**.adaptationManager.planningUtility = "seams2017a-stevens-rt"

# fixed configuration (patch swim-03); set **.adaptationManager.servers / .dimmer
# per run, or leave both at -1 for doing nothing
[Config Static]
*.adaptationManagerType = "StaticAdaptationManager"
